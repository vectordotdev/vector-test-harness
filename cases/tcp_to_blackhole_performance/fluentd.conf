<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type tcp
  @id source
  tag records
  bind @VTH_SOURCE_HOST@
  port @VTH_SOURCE_PORT@
  <parse>
    @type none
    message_key message
  </parse>
</source>
<source>
  @type monitor_agent
  @id monitor
  bind 127.0.0.1
  port @VTH_METRICS_PORT@
</source>
<match records>
  @type null
  @id destination
</match>
