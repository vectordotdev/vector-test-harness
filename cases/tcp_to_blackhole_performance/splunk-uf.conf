{
  "inputs.conf": "[tcp://@VTH_SOURCE_PORT@]\nconnection_host = none\nacceptFrom = 127.0.0.1\nsource = vth\nsourcetype = vth_raw\nindex = main\n",
  "limits.conf": "[thruput]\nmaxKBps = 0\n\n[metrics]\ninterval = 10\n",
