  "transforms.conf": "# Exclude native zero-byte Done-key controls before counting these nonempty fixture records.\n[vth_skip_empty]\nREGEX = (?s)^(.*)$\nDEST_KEY = _raw\nFORMAT = $1\nSTOP_PROCESSING_IF = length(_raw)==0\n\n[vth_drop]\nREGEX = .\nDEST_KEY = queue\nFORMAT = nullQueue\n\n[_ruleset:global_settings]\nmetrics.disabled = false\nmetrics.rule_filter = vth_drop\nmetrics.report_interval = 10s\n"
