  "props.conf": "[vth_raw]\nSHOULD_LINEMERGE = false\nLINE_BREAKER = ([\\r\\n]+)\nTRUNCATE = 0\nDATETIME_CONFIG = CURRENT\nforce_local_processing = true\n\nTRANSFORMS-vth = vth_skip_empty,vth_drop\n",
  "server.conf": "[general]\nserverName = vth\n\n[httpServer]\ndisableDefaultPort = false\n\n[license]\nactive_group = Forwarder\n\n[kvstore]\ndisabled = true\n\n[teleport_supervisor]\ndisabled = true\n",
  "web.conf": "[settings]\nstartwebserver = 0\nmgmtHostPort = 127.0.0.1:@VTH_METRICS_PORT@\n",
