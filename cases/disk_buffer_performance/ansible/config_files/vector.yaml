data_dir: /var/lib/vector

sources:
  in:
    type: socket
    mode: tcp
    address: "0.0.0.0:{{ subject_port }}"

sinks:
  out:
    inputs: ["in"]
    type: socket
    mode: tcp
    address: "{{ consumer_ip }}:{{ consumer_port }}"
    encoding:
      codec: text
    buffer:
      type: disk
      max_size: 536870912  # 512MiB (minimum is 268435488; use 512MiB to be safe)
      when_full: block
