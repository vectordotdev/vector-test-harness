[SERVICE]
    storage.path              /var/lib/fluent-bit

    # Retain full synchronization for this subject. Other subjects use different
    # policies, so this case does not compare equivalent durability guarantees.
    storage.sync              full
    storage.checksum          off
    storage.backlog.mem_limit 100M

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          {{ subject_port }}
    storage.type  filesystem

[OUTPUT]
    Name  forward
    Match *
    Host  {{ consumer_ip }}
    Port  {{ consumer_port }}
