service:
  flush: 0.05
  grace: 5
  daemon: off
  log_level: info

pipeline:
  inputs:
    - name: tcp
      tag: records
      listen: {{ source_host }}
      port: {{ source_port }}
      format: none
      chunk_size: 64
      buffer_size: 64
      mem_buf_limit: 16M
      storage.type: memory
  outputs:
    - name: http
      match: records
      host: {{ receiver_host }}
      port: {{ receiver_port }}
      uri: /
      format: json_lines
      json_date_key: false
      workers: 2
      retry_limit: no_retries
