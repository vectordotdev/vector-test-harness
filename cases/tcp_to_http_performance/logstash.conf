input {
  tcp { host => @VTH_SOURCE_HOST@ port => @VTH_SOURCE_PORT@ codec => line { charset => "UTF-8" } ecs_compatibility => disabled dns_reverse_lookup_enabled => false }
}
output {
  http {
    id => "destination"
    url => @VTH_RECEIVER_URI@
    http_method => "post"
    format => "json_batch"
    mapping => { "message" => "%{message}" }
    http_compression => false
    pool_max => 1
    pool_max_per_route => 1
    automatic_retries => 0
    retry_failed => false
    follow_redirects => false
  }
}
