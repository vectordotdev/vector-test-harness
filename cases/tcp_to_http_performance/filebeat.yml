logging.level: info
logging.to_files: false
max_procs: 2
filebeat.shutdown_timeout: 5s
setup.ilm.enabled: false
setup.template.enabled: false
queue.mem:
  events: 16384
  flush.min_events: 0
  flush.timeout: 50ms

filebeat.inputs:
  - type: tcp
    id: vth-input
    host: @VTH_SOURCE_ADDRESS@
    framing: delimiter
    line_delimiter: "\n"
    max_message_size: 1MiB
    number_of_workers: 2
    publisher_pipeline.disable_host: true

processors:
  - drop_fields:
      fields: [agent, ecs, log, input, host, event]
      ignore_missing: true

output.elasticsearch:
  hosts: [@VTH_RECEIVER_URI@]
  index: vth
  compression_level: 0
  worker: 1
  bulk_max_size: 256
  timeout: 5s
  allow_older_versions: true
