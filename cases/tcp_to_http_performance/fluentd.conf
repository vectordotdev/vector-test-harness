<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type tcp
  @id source
  tag records
  bind @VTH_SOURCE_HOST@
  port @VTH_SOURCE_PORT@
  <parse>
    @type none
    message_key message
  </parse>
</source>
<match records>
  @type http
  @id destination
  endpoint @VTH_RECEIVER_URI@
  http_method post
  content_type application/x-ndjson
  json_array false
  reuse_connections true
  <format>
    @type json
  </format>
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 0.05s
    flush_thread_count 2
    chunk_limit_size 1m
    total_limit_size 16m
    overflow_action block
    flush_at_shutdown true
    retry_max_times 0
  </buffer>
</match>
