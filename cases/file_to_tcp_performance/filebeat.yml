logging.level: info
logging.to_files: false
max_procs: 2
filebeat.shutdown_timeout: 5s
setup.ilm.enabled: false
setup.template.enabled: false
queue.mem:
  events: 16384
  flush.min_events: 0
  flush.timeout: 50ms

filebeat.inputs:
  - type: filestream
    id: vth-input
    paths: [@VTH_INPUT_FILE@]
    file_identity.native: ~
    prospector.scanner.check_interval: 100ms
    publisher_pipeline.disable_host: true

processors:
  - drop_fields:
      fields: [agent, ecs, log, input, host, event]
      ignore_missing: true

output.logstash:
  hosts: [@VTH_RECEIVER_ADDRESS@]
  compression_level: 0
  worker: 1
  pipelining: 0
  bulk_max_size: 256
  timeout: 5s
