# Vector 0.61 workload variant. Historical measurements used the former TOML definition.
data_dir: /var/lib/vector
sources:
  in:
    type: syslog
    mode: tcp
    address: 0.0.0.0:{{ subject_port }}
transforms:
  company_api:
    type: filter
    inputs:
    - in
    condition: .appname == "company-api"
  company_admin:
    type: filter
    inputs:
    - in
    condition: .appname == "company-admin"
  company_media_proxy:
    type: filter
    inputs:
    - in
    condition: .appname == "company-media-proxy"
  company_unfurler:
    type: filter
    inputs:
    - in
    condition: .appname == "company-unfurler"
  audit:
    type: filter
    inputs:
    - in
    condition: .appname == "audit"
sinks:
  company_api_http:
    type: http
    inputs:
    - company_api
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
      only_fields:
      - time
      - endpoint
      - hostname
      - http_cf_ray
      - http_debug_options
      - http_content_length
      - http_method
      - http_referrer
      - http_remote_addr
      - http_response_time
      - http_route
      - http_status_code
      - http_user_agent
      - http_version
      - ip_country
      - ip_metro
      - user_id
      - metadata_trace_id
      - metadata_guild_id
      - metadata_channel_id
      - metadata_method
      timestamp_format: unix
    request:
      rate_limit_duration_secs: 5
      rate_limit_num: 1000
      concurrency: 1000
    buffer:
      type: memory
      max_events: 5000
      when_full: block
    batch:
      timeout_secs: 5
      max_bytes: 5245000
    framing:
      method: newline_delimited
  company_admin_http:
    type: http
    inputs:
    - company_admin
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
      only_fields:
      - time
      - endpoint
      - hostname
      - http_cf_ray
      - http_debug_options
      - http_content_length
      - http_method
      - http_referrer
      - http_remote_addr
      - http_response_time
      - http_route
      - http_status_code
      - http_user_agent
      - http_version
      - user_id
      - metadata_trace_id
      - metadata_method
      timestamp_format: unix
    request:
      rate_limit_duration_secs: 5
      rate_limit_num: 1000
      concurrency: 1000
    buffer:
      type: memory
      max_events: 5000
      when_full: block
    batch:
      timeout_secs: 5
      max_bytes: 5245000
    framing:
      method: newline_delimited
  company_media_proxy_http:
    type: http
    inputs:
    - company_media_proxy
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
      only_fields:
      - time
      - hostname
      - msg
      - bhash
      - bhash_duration
      - input_type
      - input_size_bytes
      - input_height_px
      - input_width_px
      - output_type
      - output_size_bytes
      - output_height_px
      - output_width_px
      - downloaded_in_ms
      - resized_in_ms
      - request_type
      - source
      - source_host
      - stacktrace
      timestamp_format: unix
    request:
      rate_limit_duration_secs: 5
      rate_limit_num: 1000
      concurrency: 1000
    buffer:
      type: memory
      max_events: 5000
      when_full: block
    batch:
      timeout_secs: 5
      max_bytes: 5245000
    framing:
      method: newline_delimited
  company_unfurler_http:
    type: http
    inputs:
    - company_unfurler
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
      only_fields:
      - time
      - hostname
      - host
      - url
      - msg
      - success
      timestamp_format: unix
    request:
      rate_limit_duration_secs: 5
      rate_limit_num: 1000
      concurrency: 1000
    buffer:
      type: memory
      max_events: 5000
      when_full: block
    framing:
      method: newline_delimited
  audit_http:
    type: http
    inputs:
    - audit
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
      only_fields:
      - time
      - hostname
      - content
      - tag
      - pid
      timestamp_format: unix
    request:
      rate_limit_duration_secs: 5
      rate_limit_num: 1000
      concurrency: 1000
    buffer:
      type: memory
      max_events: 5000
      when_full: block
    framing:
      method: newline_delimited
