# All real-world variants share this template and output contract.
{% set streams = {
  'api': {'app': 'company-api', 'port': subject_api_port},
  'admin': {'app': 'company-admin', 'port': subject_admin_port},
  'media_proxy': {'app': 'company-media-proxy', 'port': subject_media_proxy_port},
  'unfurler': {'app': 'company-unfurler', 'port': subject_unfurler_port},
  'audit': {'app': 'audit', 'port': subject_audit_port}
} %}
{% set separate = vector_separate_sources | default(false) %}
{% set process = vector_process_events | default(true) %}
{% set single_sink = vector_single_sink | default(false) %}
data_dir: /var/lib/vector
sources:
{% if separate %}
{% for stream, settings in streams.items() %}
  in_{{ stream }}:
    type: syslog
    mode: tcp
    address: 0.0.0.0:{{ settings.port }}
    host_key: hostname
{% endfor %}
{% else %}
  in:
    type: syslog
    mode: tcp
    address: 0.0.0.0:{{ subject_port }}
    host_key: hostname
{% endif %}
{% if not separate or process %}
transforms:
{% if not separate %}
  by_app:
    type: route
    inputs: [in]
    reroute_unmatched: false
    route:
{% for stream, settings in streams.items() %}
      {{ stream }}: .appname == "{{ settings.app }}"
{% endfor %}
{% endif %}
{% if process %}
{% for stream, settings in streams.items() %}
  process_{{ stream }}:
    type: remap
    inputs: [{{ 'in_' ~ stream if separate else 'by_app.' ~ stream }}]
    drop_on_error: true
    source: |
{% if separate %}
      if .appname != "{{ settings.app }}" { abort }
{% endif %}
{% if stream == 'audit' %}
      . = {
        "appname": .appname,
        "hostname": .hostname,
        "timestamp": .timestamp,
        "message": .message,
        "procid": .procid
      }
{% else %}
      hostname = .hostname
{% if stream in ['api', 'admin'] %}
      event_time = .timestamp
{% endif %}
      . = object!(parse_json!(string!(.message)))
      .appname = "{{ settings.app }}"
      .hostname = hostname
{% if stream in ['media_proxy', 'unfurler'] %}
      .timestamp = parse_timestamp!(string!(del(.ts)), format: "%+")
{% else %}
      .timestamp = event_time
      .metadata_trace_id = del(.metadata.trace_id)
{% if stream == 'api' %}
      .metadata_guild_id = del(.metadata.guild_id)
      .metadata_channel_id = del(.metadata.channel_id)
{% endif %}
      .metadata_method = del(.metadata.method, compact: true)
{% endif %}
{% if stream == 'unfurler' %}
      if .msg != "unfurl" { abort }
{% endif %}
{% endif %}
{% endfor %}
{% endif %}
{% endif %}
sinks:
{% for sink in (['all'] if single_sink else streams.keys()) %}
{% set scale = streams | length if single_sink else 1 %}
  http_{{ sink }}:
    type: http
    inputs:
{% for stream in streams if single_sink or stream == sink %}
    - {{ 'process_' ~ stream if process else ('in_' ~ stream if separate else 'by_app.' ~ stream) }}
{% endfor %}
    uri: http://{{ consumer_ip }}:{{ consumer_port }}
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      concurrency: {{ (vector_request_concurrency | default(100) | int) * scale }}
{% if vector_rate_limit | default(true) %}
      rate_limit_duration_secs: 5
      rate_limit_num: {{ 60 * scale }}
{% endif %}
    buffer:
      type: memory
      max_events: {{ 5000 * scale }}
    batch:
      max_bytes: 5245000
      timeout_secs: 5
{% endfor %}
{% if process %}
tests:
- name: normalize all five application streams
  inputs:
{% for stream, settings in streams.items() %}
  - insert_at: process_{{ stream }}
    type: vrl
    source: |
{% if stream in ['media_proxy', 'unfurler'] %}
      . = parse_syslog!(s'<118>1 2020-03-13T20:45:38.119Z my.host.com {{ settings.app }} 2004 ID960 - {"ts":"2020-03-13T20:45:38.119Z","msg":"unfurl"}')
{% else %}
      . = parse_syslog!(s'<118>1 2020-03-13T20:45:38.119Z my.host.com {{ settings.app }} 2004 ID960 - {"metadata":{"trace_id":"trace123","guild_id":"guild123","channel_id":"channel123","method":"method"}}')
{% endif %}
{% endfor %}
  outputs:
{% for stream, settings in streams.items() %}
  - extract_from: process_{{ stream }}
    expected_event_count: 1
    conditions:
    - type: vrl
      source: |
        assert_eq!(.appname, "{{ settings.app }}")
        assert_eq!(.hostname, "my.host.com")
        assert!(is_timestamp(.timestamp))
{% if stream in ['api', 'admin'] %}
        assert_eq!(.metadata_trace_id, "trace123")
{% endif %}
{% if stream == 'audit' %}
        assert!(is_string(.message))
{% endif %}
{% endfor %}
- name: reject malformed application JSON
  inputs:
{% for stream in streams if stream != 'audit' %}
  - insert_at: process_{{ stream }}
    type: log
    log_fields:
      message: '{invalid JSON'
      appname: '{{ streams[stream].app }}'
{% endfor %}
  outputs:
  - extract_from:
{% for stream in streams if stream != 'audit' %}
    - process_{{ stream }}
{% endfor %}
    expected_event_count: 0
{% endif %}
