##
## audit
##

[transforms.audit_filter]
  type = "filter"
  inputs = ["in"]
  condition = '.appname == "audit"'

[transforms.audit_process]
  type = "remap"
  inputs = ["audit_filter"]
  source = '''
    .tag = del(.appname)
    .hostname = del(.host)
    .content = del(.message)
    .time = del(.timestamp)
