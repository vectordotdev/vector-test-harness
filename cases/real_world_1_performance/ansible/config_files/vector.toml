data_dir = "/var/lib/vector"

[sources.in]
  type = "syslog"
  mode = "tcp"
  address = "0.0.0.0:{{ subject_port }}"

##
## company-api
##

[transforms.company_api]
  type = "filter"
  inputs = ["in"]
  condition = '.appname == "company-api"'

[transforms.company_api_process]
  type = "remap"
  inputs = ["company_api"]
  source = '''
    parsed, err = parse_json(.message)
    if err == null && is_object(parsed) {
      . = merge!(., parsed)
    }
    .hostname = del(.host)
    .metadata_trace_id = string(.metadata.trace_id) ?? ""
    .metadata_guild_id = string(.metadata.guild_id) ?? ""
    .metadata_channel_id = string(.metadata.channel_id) ?? ""
    .metadata_method = string(.metadata.method) ?? ""
  '''

[sinks.company_api_http]
  type = "http"
  inputs = ["company_api_process"]
  uri = "http://{{ consumer_ip }}:{{ consumer_port }}"
  encoding.codec = "json"
  request.concurrency = 100
  request.rate_limit_duration_secs = 5
  request.rate_limit_num = 60

  [sinks.company_api_http.batch]
    max_bytes = 5245000
    timeout_secs = 5

  [sinks.company_api_http.buffer]
    type = "memory"
    max_events = 5000
    when_full = "block"

