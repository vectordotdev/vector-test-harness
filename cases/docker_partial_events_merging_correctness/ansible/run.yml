---
- import_playbook: reset.yml

- hosts: '{{ test_namespace }}:&tag_TestRole_subject'
  become: true
  tasks:
    - include_role:
        name: test_servers
      vars:
        action: start
        http_server_port: "{{ http_consumer_port }}"
        tcp_server_port: "{{ tcp_consumer_port }}"

    - include_role:
        name: docker
      vars:
        action: start

    # We delegate testing to subject specific files to delegate, entirely, the
    # process of verifying behavior. The method used is irrelevant to the result
    # and it could differ across subjects.
    - name: "Test {{ test_subject }}"
      include_tasks: "run/{{ test_subject }}.yml"

    - include_role:
        name: test_servers
      vars:
        action: stop

    - include_role:
        name: docker
      vars:
        action: stop

    - name: Capture last_message
      include_tasks: "capture_last_message/{{ test_subject }}.yml"

    - assert:
        that:
          - summary.message_count == 1
          - last_message.message == 'Log text'
          - last_message | length == 1353
          - last_message.bzz == 'bzz_value'
        fail_msg: Expected one complete Docker log record, including its final padding field
