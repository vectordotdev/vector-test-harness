sources:
  in:
    type: docker_logs
transforms:
  parse_json:
    inputs:
    - in
    type: remap
    source: |
      parsed, err = parse_json(string!(.message))
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
      }
sinks:
  out:
    inputs:
    - parse_json
    type: socket
    mode: tcp
    address: 127.0.0.1:{{ tcp_consumer_port }}
    encoding:
      codec: text
tests:
- name: decoded Docker JSON keeps the application message
  inputs:
  - insert_at: parse_json
    type: log
    log_fields:
      message: '{"message": "Log text", "extra": "preserved"}'
  outputs:
  - extract_from: parse_json
    conditions:
    - type: vrl
      source: |
        assert_eq!(.message, "Log text")
        assert_eq!(.extra, "preserved")
- name: plain Docker output remains unchanged
  inputs:
  - insert_at: parse_json
    type: log
    log_fields:
      message: plain log
  outputs:
  - extract_from: parse_json
    conditions:
    - type: vrl
      source: |
        assert_eq!(.message, "plain log")
