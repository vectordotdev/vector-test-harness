[sources.in]
  type = "docker_logs"

[transforms.parse_json]
  inputs  = ["in"]
  type    = "remap"
  source = '''
    parsed, err = parse_json(string!(.message))
    if err == null {
      . = merge(., parsed)
      del(.message)
    }
  '''

[sinks.out]
  inputs   = ["parse_json"]
  type     = "socket"
  mode     = "tcp"
  address  = "127.0.0.1:{{ tcp_consumer_port }}"
  encoding.codec = "text"
