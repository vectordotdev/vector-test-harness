<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type tail
  @id source
  tag records
  path @VTH_CONTAINER_LOG@
  pos_file @VTH_POSITION_FILE@
  read_from_head true
  encoding UTF-8
  refresh_interval 0.1s
  <parse>
    @type json
    time_key ""
    keep_time_key true
  </parse>
</source>
<filter records>
  @type concat
  key log
  stream_identity_key stream
  multiline_end_regexp /\n$/
  separator ""
  flush_interval 0
</filter>
<filter records>
  @type parser
  key_name log
  reserve_data false
  <parse>
    @type json
    time_key ""
    keep_time_key true
  </parse>
</filter>
<match records>
  @type forward
  @id destination
  heartbeat_type none
  require_ack_response false
  time_as_integer true
  compress text
  <server>
    host @VTH_RECEIVER_HOST@
    port @VTH_RECEIVER_PORT@
  </server>
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 0.05s
    flush_thread_count 2
    chunk_limit_size 1m
    total_limit_size 16m
    overflow_action block
    flush_at_shutdown true
    retry_max_times 0
  </buffer>
</match>
