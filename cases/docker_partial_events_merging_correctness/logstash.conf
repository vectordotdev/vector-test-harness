input {
  file {
    path => [@VTH_CONTAINER_LOG@]
    start_position => "beginning"
    sincedb_path => @VTH_POSITION_FILE@
    stat_interval => 0.1
    codec => json
    ecs_compatibility => disabled
  }
}
filter {
  # The shared launcher uses one ordered worker for this stateful native filter.
  aggregate {
    task_id => "%{stream}"
    code => '
      fragment = event.get("log")
      raise TypeError, "Docker log fragment is not a string" unless fragment.is_a?(String)
      map["buffer"] ||= ""
      map["buffer"] << fragment
      raise RangeError, "Docker record exceeds 1 MiB" if map["buffer"].bytesize > 1048576
      if fragment.end_with?("\n")
        event.set("vth_reassembled", map.delete("buffer"))
      else
        event.cancel()
      end
    '
    timeout => 30
  }
  if [vth_reassembled] {
    json {
      source => "vth_reassembled"
      target => "[@metadata][application]"
    }
    ruby {
      code => '
        application = event.get("[@metadata][application]")
        raise TypeError, "Reassembled Docker payload is not a JSON object" unless application.is_a?(Hash)
        event.to_hash.keys.each { |key| event.remove(key) }
        application.each { |key, value| event.set(key, value) }
      '
    }
  }
}
output {
  tcp {
    id => "destination"
    host => @VTH_RECEIVER_HOST@
    port => @VTH_RECEIVER_PORT@
    codec => json_lines
  }
}
