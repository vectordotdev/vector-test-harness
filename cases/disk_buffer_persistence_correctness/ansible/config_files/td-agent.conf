<source>
  @type tcp
  tag in
  port {{ subject_port }}
  bind 127.0.0.1

  <parse>
    @type json
  </parse>
</source>

<match in>
  @type http
  endpoint_url http://127.0.0.1:{{ http_consumer_port }}/
  serializer json
  buffered true

  <buffer>
    @type file
    path /var/log/fluent/tcp.buffer
    flush_interval 1s
    retry_wait 1s
  </buffer>

</match>
