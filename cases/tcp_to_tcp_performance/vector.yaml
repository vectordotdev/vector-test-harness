data_dir: {{ data_dir }}

sources:
  in:
    type: socket
    mode: tcp
    address: {{ source_address }}
    framing:
      method: newline_delimited
    decoding:
      codec: bytes

sinks:
  out:
    buffer:
      type: memory
      max_events: 512
      when_full: block
    acknowledgements:
      enabled: false
    inputs: ["in"]
    type: socket
    mode: tcp
    address: {{ receiver_address }}
    framing:
      method: newline_delimited
    encoding:
      codec: text
