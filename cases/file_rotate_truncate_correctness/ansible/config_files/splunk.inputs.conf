[default]
_TCP_ROUTING=discard
_INDEX_AND_FORWARD_ROUTING=*

# Allows data from _any_ host on the specified port
[monitor://{{ test_file_location }}*]
_TCP_ROUTING=group1
disabled=false
followTail=0

# The package explicitly routes this internal input to every output group.
[monitor://$SPLUNK_HOME/etc/splunk.version]
disabled=true
