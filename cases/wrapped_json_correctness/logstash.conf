input {
  tcp { host => @VTH_SOURCE_HOST@ port => @VTH_SOURCE_PORT@ codec => json_lines ecs_compatibility => disabled dns_reverse_lookup_enabled => false }
}
filter {
  json {
    source => "log"
    remove_field => ["log", "@timestamp", "@version", "host", "port", "event"]
  }
}
output {
  tcp { id => "destination" host => @VTH_RECEIVER_HOST@ port => @VTH_RECEIVER_PORT@ codec => json_lines }
}
