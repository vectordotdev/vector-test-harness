logging.level: info
shutdown_timeout: 5s

filebeat.inputs:
- type: tcp
  max_message_size: 10MiB
  host: "127.0.0.1:{{ subject_port }}"

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
  - decode_json_fields:
      fields: ["log"]
      target: ""
      overwrite_keys: true

output.logstash:
  hosts: ["127.0.0.1:{{ beats_consumer_port }}"]
  bulk_max_size: 1
