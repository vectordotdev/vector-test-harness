[sources.in]
  type    = "socket"
  mode    = "tcp"
  address = "127.0.0.1:{{ subject_port }}"

[transforms.parse_wrapped_json]
  inputs = ["in"]
  type   = "remap"
  source = '''
    . = merge!(., parse_json!(string!(.message)))
    . = merge!(., parse_json!(string!(.log)))
    del(.log)
  '''

[sinks.out]
  inputs         = ["parse_wrapped_json"]
  type           = "socket"
  mode           = "tcp"
  address        = "127.0.0.1:{{ tcp_consumer_port }}"
  encoding.codec = "json"
