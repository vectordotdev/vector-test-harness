[SERVICE]
    Flush 1
    Parsers_File /etc/fluent-bit/td-agent-bit.parsers.conf

[INPUT]
    Name   tcp
    Listen 127.0.0.1
    Port   {{ subject_port }}

[FILTER]
    Name     parser
    Match    *
    Key_Name log
    Parser   json

# Save decoded JSON for the payload assertion.
[OUTPUT]
    Name   file
    Match  *
    Path   /tmp
    File   fluentbit-output.ndjson
    Format plain
