<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type tcp
  @id source
  tag records
  bind @VTH_SOURCE_HOST@
  port @VTH_SOURCE_PORT@
  <parse>
    @type json
  </parse>
</source>
<filter records>
  @type parser
  key_name log
  reserve_data false
  <parse>
    @type json
  </parse>
</filter>
<match records>
  @type forward
  @id destination
  heartbeat_type none
  require_ack_response false
  time_as_integer true
  compress text
  <server>
    host @VTH_RECEIVER_HOST@
    port @VTH_RECEIVER_PORT@
  </server>
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 0.05s
    flush_thread_count 2
    chunk_limit_size 1m
    total_limit_size 16m
    overflow_action block
    flush_at_shutdown true
    retry_max_times 0
  </buffer>
</match>
