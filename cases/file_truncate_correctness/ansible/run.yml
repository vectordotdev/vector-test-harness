---
- import_playbook: reset.yml

- hosts: '{{ test_namespace }}:&tag_TestRole_subject'
  become: true
  tasks:
    - name: Create the test log file
      include_role:
        name: flog
      vars:
        action: create_test_file
        bytes: 104857600
        location: "{{ test_file_location }}"
        encoding: text

    - name: Start test servers
      include_role:
        name: test_servers
      vars:
        action: start

    - name: Start {{ test_subject }}
      include_role:
        name: "{{ test_subject }}"
      vars:
        action: start

    - name: Wait for Logstash to deliver initial file events before truncating
      uri:
        url: http://127.0.0.1:9600/_node/stats/pipelines
        return_content: true
      register: logstash_stats
      until: (logstash_stats.json | default({})).get('pipelines', {}).get('main', {}).get('events', {}).get('out', 0) > 0
      retries: 60
      delay: 1
      when: test_subject == 'logstash'

    - name: Wait 15 seconds
      pause:
        seconds: 15

    - name: Truncate file
      shell: truncate -s 0 {{ test_file_location }}

    - name: Add 1 line to the rotated file
      shell: echo "Hello world" >> {{ test_file_location }}

    - name: Wait 15 seconds
      pause:
        seconds: 15

    - name: Stop {{ test_subject }}
      include_role:
        name: "{{ test_subject }}"
      vars:
        action: stop

    - name: Stop test servers
      include_role:
        name: test_servers
      vars:
        action: stop

    - name: Capture summary
      include_role:
        name: "{{ 'http_test_server' if test_subject == 'fluentd' else 'tcp_test_server' }}"
      vars:
        action: register_summary

    - set_fact:
        last_message: "{{ summary.last_message }}"

    - debug:
        var: last_message

    - assert:
        that:
          - last_message is search("Hello world")
