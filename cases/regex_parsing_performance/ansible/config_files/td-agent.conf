<source>
  @type tcp
  tag in
  port {{ subject_port }}
  bind 0.0.0.0

  <parse>
    @type none
  </parse>
</source>

<filter **>
  @type parser
  key_name message
  reserve_data false

  <parse>
    @type regexp
    expression /^(?<host>[^ ]*) - (?<user>[^ ]*) (?<bytes>[^ ]*) \[(?<time>[^ ]*)\] "(?<method>\S+) (?<path>.*)" (?<code>[^ ]*) (?<size>[^ ]*)$/
  </parse>
</filter>

<match **>
  @type forward
  <server>
    host {{ consumer_ip }}
    port {{ consumer_port }}
  </server>
</match>
