[sources.in]
  type    = "socket"
  mode    = "tcp"
  address = "0.0.0.0:{{ subject_port }}"

[transforms.apache_common_parser]
  inputs = ["in"]
  type   = "remap"
  source = '''
    . = parse_regex!(.message, r'^(?P<host>[\w\.]+) - (?P<user>[\w]+) (?P<bytes_in>[\d]+) \[(?P<timestamp>[^\]]*)\] "(?P<method>[\w]+) (?P<path>[^"]*)" (?P<status>[\d]+) (?P<bytes_out>[\d]+)$')
  '''

[sinks.out]
  inputs  = ["apache_common_parser"]
  type    = "socket"
  mode    = "tcp"
  address = "{{ consumer_ip }}:{{ consumer_port }}"
  encoding.codec = "text"
