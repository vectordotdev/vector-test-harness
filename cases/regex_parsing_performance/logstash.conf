input {
  tcp { host => @VTH_SOURCE_HOST@ port => @VTH_SOURCE_PORT@ codec => line { charset => "UTF-8" } ecs_compatibility => disabled dns_reverse_lookup_enabled => false }
}
filter {
  grok {
    match => { "message" => "^(?<host>[^ ]+) - (?<user>[^ ]+) (?<bytes_in>[^ ]+) \[(?<timestamp>[^\]]+)\] \"(?<method>[^ ]+) (?<path>[^\"]+)\" (?<status>[^ ]+) (?<bytes_out>[^ ]+)$" }
    overwrite => ["host"]
    remove_field => ["message", "@timestamp", "@version", "event", "port"]
  }
}
output {
  tcp { id => "destination" host => @VTH_RECEIVER_HOST@ port => @VTH_RECEIVER_PORT@ codec => json_lines }
}
