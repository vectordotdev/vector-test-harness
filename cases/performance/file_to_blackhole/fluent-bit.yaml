service:
  flush: 0.05
  grace: 5
  daemon: off
  log_level: info
  http_server: on
  http_listen: 127.0.0.1
  http_port: @VTH_METRICS_PORT@
pipeline:
  inputs:
    - name: tail
      tag: records
      path: @VTH_LOG_GLOB@
      key: message
      db: @VTH_POSITION_FILE@
      read_from_head: true
      refresh_interval: 1
      buffer_max_size: 1M
      mem_buf_limit: 16M
      storage.type: memory
  outputs:
    - name: 'null'
      alias: destination
      match: records
      workers: 2
