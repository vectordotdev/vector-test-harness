<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type tail
  @id source
  tag records
  path @VTH_LOG_GLOB@
  pos_file @VTH_POSITION_FILE@
  read_from_head true
  encoding UTF-8
  refresh_interval 1s
  <parse>
    @type none
    message_key message
  </parse>
</source>
<source>
  @type monitor_agent
  bind 127.0.0.1
  port @VTH_METRICS_PORT@
</source>
<match records>
  @type null
  @id destination
</match>
