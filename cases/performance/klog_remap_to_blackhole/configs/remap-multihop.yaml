# Equivalent klog processing in two VRL nodes or one; new baseline required.
data_dir: data
sources:
  stdin:
    type: stdin
transforms:
  parse_payload:
    type: remap
    inputs:
    - stdin
    source: |
      parsed, err = parse_json(.message)
      .log = if err == null { parsed } else { .message }
      .log_type = if err == null { "json" } else { "text" }
      del(.message)
  timestamp:
    type: remap
    inputs:
    - parse_payload
    source: |
      if is_float(.log.ts) || is_integer(.log.ts) {
        .timestamp = from_unix_timestamp!(to_int(to_float!(.log.ts) * 1000000000), unit: "nanoseconds")
      }
  by_format:
    type: route
    inputs:
    - timestamp
    reroute_unmatched: false
    route:
      json: .log_type == "json"
      text: .log_type == "text"
  reduce:
    type: reduce
    inputs:
    - by_format.text
    merge_strategies:
      log: concat_newline
    starts_when: match!(.log, r'^[IWEF]\d{4}\s')
sinks:
  blackhole:
    type: blackhole
    inputs:
    - reduce
    - by_format.json
tests:
- name: plain and structured klog
  inputs:
  - insert_at: parse_payload
    type: log
    log_fields:
      message: I1025 00:15:15.525108       1 controller_utils.go:116] first record
  - insert_at: parse_payload
    type: log
    log_fields:
      message: '{"ts":1580306777.04728,"msg":"Pod status updated","pod":{"name":"nginx-1","namespace":"default"},"status":"ready"}'
  outputs:
  - extract_from: timestamp
    expected_event_count: 2
    conditions:
    - type: vrl
      source: |
        assert!(!exists(.message))
        if .log_type == "json" {
          assert_eq!(.log.msg, "Pod status updated")
          assert_eq!(.log.pod.name, "nginx-1")
          assert!(is_timestamp(.timestamp))
        } else {
          assert_eq!(.log_type, "text")
          assert_eq!(.log, "I1025 00:15:15.525108       1 controller_utils.go:116] first record")
        }
