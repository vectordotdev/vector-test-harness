input { stdin { codec => line { charset => "UTF-8" } } }
filter {
  json {
    source => "message"
    target => "log"
    skip_on_invalid_json => true
    remove_field => ["message"]
  }
  if [message] {
    mutate {
      rename => { "message" => "log" }
      add_field => { "log_type" => "text" }
    }
    ruby {
      init => '@record_id = 0'
      code => '
        @record_id += 1 if event.get("log") =~ /^[IWEF]\d{4}\s/
        event.set("[@metadata][record_id]", @record_id)
      '
    }
    aggregate {
      task_id => "%{[@metadata][record_id]}"
      code => '
        if map.empty?
          map.merge!(event.to_hash)
        else
          map["log"] += "\n" + event.get("log")
        end
        event.cancel()
      '
      push_previous_map_as_event => true
      timeout => 86400
    }
  } else {
    mutate { add_field => { "log_type" => "json" } }
    ruby {
      code => '
        ts = event.get("[log][ts]")
        if ts.is_a?(Numeric)
          ns = (ts.to_f * 1000000000).to_i
          event.set("timestamp", java.time.Instant.ofEpochSecond(ns.div(1000000000), ns % 1000000000).toString)
        end
      '
    }
  }
  if ![timestamp] {
    mutate { rename => { "@timestamp" => "timestamp" } }
  }
  mutate {
    add_field => { "source_type" => "stdin" }
    remove_field => ["@timestamp", "@version", "event", "tags"]
  }
}
output {
  file {
    id => "destination"
    path => @VTH_CAPTURE_FILE@
    codec => json_lines
    flush_interval => 0
  }
}
