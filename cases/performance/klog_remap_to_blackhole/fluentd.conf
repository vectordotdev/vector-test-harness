<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type stdin
  format none
  tag records
</source>
<filter records>
  @type parser
  key_name message
  reserve_data true
  reserve_time true
  remove_key_name_field true
  hash_value_field log
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key ""
    keep_time_key true
  </parse>
</filter>
<filter records>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    log ${record.key?("message") ? record["message"].dup.force_encoding("UTF-8") : record["log"]}
    log_type ${record.key?("message") ? "text" : "json"}
    host ${hostname}
    source_type stdin
    timestamp ${if record["log"].is_a?(Hash) && record["log"]["ts"].is_a?(Numeric); ns = (record["log"]["ts"].to_f * 1000000000).to_i; Time.at(ns.div(1000000000), ns % 1000000000, :nanosecond).utc.iso8601(9); else; time.to_time.utc.iso8601(9); end}
  </record>
</filter>
<match records>
  @type copy
  <store>
    @type relabel
    @label @JSON
  </store>
  <store>
    @type relabel
    @label @TEXT
  </store>
</match>
<label @JSON>
  <filter records>
    @type grep
    <regexp>
      key log_type
      pattern /^json$/
    </regexp>
  </filter>
  <match records>
    @type relabel
    @label @OUT
  </match>
</label>
<label @TEXT>
  <filter records>
    @type grep
    <regexp>
      key log_type
      pattern /^text$/
    </regexp>
  </filter>
  <filter records>
    @type concat
    key log
    multiline_start_regexp /^[IWEF]\d{4}\s/
    separator "\n"
    flush_interval 0
    use_first_timestamp true
    timeout_label @OUT
  </filter>
  <match records>
    @type relabel
    @label @OUT
  </match>
</label>
<label @OUT>
  <match records>
    @type file
    @id destination
    path @VTH_CAPTURE_FILE@
    append true
    add_path_suffix false
    <format>
      @type json
    </format>
    <buffer []>
      @type memory
      flush_mode interval
      flush_interval 0.05s
      flush_thread_count 1
      chunk_limit_size 1m
      total_limit_size 16m
      overflow_action block
      flush_at_shutdown true
      retry_max_times 0
    </buffer>
  </match>
</label>
