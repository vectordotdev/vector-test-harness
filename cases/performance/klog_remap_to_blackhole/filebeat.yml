# Native CEL buffers the finite stdin input through EOF; this profile proves payloads, not streaming capacity.
logging.level: info
logging.metrics.period: 100ms
logging.to_files: false
max_procs: 2
filebeat.shutdown_timeout: 5s
setup.ilm.enabled: false
setup.template.enabled: false
queue.mem:
  events: 16384
  flush.min_events: 0
  flush.timeout: 50ms

filebeat.inputs:
  - type: cel
    id: vth-cel-stdin
    interval: 1h
    resource.url: ""
    keep_null: true
    program: |
      has(state.cursor) && state.cursor.done ? {"events": [], "want_more": false} :
      string(file("/dev/stdin")).as(text,
        text.substring(0, text.size()-1).split("\n").as(lines,
          lines.filter(line, !is_error(line.decode_json())).map(line,
            line.decode_json().as(log, {"vth_app": {
              "log": log,
              "log_type": "json",
              "timestamp": type(log) == type({}) && has(log.ts) && (type(log.ts) == int || type(log.ts) == double) ?
                (timestamp("1970-01-01T00:00:00Z") + duration(string(int(double(log.ts) * 1000000000.0)) + "ns")).format(time_layout.RFC3339Nano) :
                now.format(time_layout.RFC3339Nano)
            }})
          ).as(structured,
            lines.filter(line, is_error(line.decode_json())).as(plain,
              (plain.size() == 0 ? [] :
                (plain.map(line, (line.matches("^[IWEF][0-9]{4}\\s") ? "\u001e" : "") + string(line.encode_json())).join("\n") + "\n\u001e")
                .split("\u001e").filter(group, group != "")
                .map(group, group.substring(0, group.size()-1).split("\n").map(line, line.decode_json()).join("\n"))
                .map(log, {"vth_app": {"log": log, "log_type": "text", "timestamp": now.format(time_layout.RFC3339Nano)}})
              ).as(unstructured, {
                "events": structured + unstructured,
                "cursor": {"done": true},
                "want_more": false
              })
            )
          )
        )
      )

processors:
  - script:
      lang: javascript
      source: |
        function process(event) {
          var app = event.Get("vth_app");
          var host = event.Get("host.name");
          if (app === null || typeof host !== "string") {
            throw "missing native application record or execution host";
          }
          app.host = host;
          app.source_type = "stdin";
          event.Put("vth_encoded", JSON.stringify(app));
        }

output.file:
  path: @VTH_CAPTURE_FILE@
  filename: records
  rotate_every_kb: 2097152
  number_of_files: 2
  rotate_on_startup: false
  codec.format:
    string: '%{[vth_encoded]}'
