<system>
  config_include_dir ""
  workers 1
  log_level info
  <log>
    format json
  </log>
</system>
<source>
  @type stdin
  format none
  tag records
</source>
<source>
  @type monitor_agent
  bind 127.0.0.1
  port @VTH_METRICS_PORT@
</source>
<match records>
  @type null
  @id destination
</match>
