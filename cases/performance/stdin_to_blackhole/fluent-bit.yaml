service:
  flush: 0.05
  grace: 5
  daemon: off
  log_level: info
  http_server: on
  http_listen: 127.0.0.1
  http_port: @VTH_METRICS_PORT@
parsers:
  - name: raw_line
    format: regex
    regex: '^(?<message>[^\n]*)(?=\n)'
pipeline:
  inputs:
    - name: stdin
      tag: records
      parser: raw_line
      buffer_size: 64k
      mem_buf_limit: 16M
  outputs:
    - name: 'null'
      alias: destination
      match: records
      workers: 2
