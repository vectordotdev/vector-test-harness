[sources.in]
  type    = "socket"
  mode    = "tcp"
  address = "0.0.0.0:{{ subject_port }}"

[transforms.lua]
  inputs = ["in"]
  type = "lua"
  version = "2"
  hooks.process = "process"
  source = """
  function process(event, emit)
    event.log["new_field"] = "new value"
    emit(event)
  end
  """

[sinks.out]
  inputs   = ["lua"]
  type     = "socket"
  mode     = "tcp"
  address  = "{{ consumer_ip }}:{{ consumer_port }}"
  encoding.codec = "text"
