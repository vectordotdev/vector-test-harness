---
- name: Stop dstat (SIGINT triggers Python cleanup and flushes CSV buffer)
  shell: pkill -SIGINT -f dstat; sleep 2
  failed_when: false

- include_role:
    name: subjects
  vars:
    action: load_facts

- name: Check if dstat CSV was created
  stat:
    path: /tmp/dstat.csv
  register: dstat_csv

- name: Upload dstat CSV to S3
  command:
    argv:
      - aws
      - s3
      - cp
      - /tmp/dstat.csv
      - '{{ profiling_results_s3_url }}'
      - --acl
      - bucket-owner-full-control
  when: dstat_csv.stat.exists
