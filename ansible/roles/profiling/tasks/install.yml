---
- name: Install dstat dependencies
  apt:
    name:
      - python3
      - python3-termcolor
    state: present
    update_cache: yes

- name: Install dstat (Python 3 compatible)
  get_url:
    url: https://raw.githubusercontent.com/dstat-real/dstat/master/dstat
    dest: /usr/local/bin/dstat
    mode: '0755'

- name: Fix dstat shebang to use python3
  replace:
    path: /usr/local/bin/dstat
    regexp: '^#!/usr/bin/env python$'
    replace: '#!/usr/bin/env python3'

- name: Fix dstat Python 3.10 — add collections.abc import
  replace:
    path: /usr/local/bin/dstat
    regexp: '^import collections$'
    replace: "import collections\nimport collections.abc"

- name: Fix dstat Python 3.10 — collections.Sequence
  replace:
    path: /usr/local/bin/dstat
    regexp: '\bcollections\.Sequence\b'
    replace: 'collections.abc.Sequence'

- name: Fix dstat Python 3.10 — types.ListType and TupleType
  shell: |
    sed -i -e 's/types\.ListType/list/g' -e 's/types\.TupleType/tuple/g' \
      -e 's/types\.StringTypes/str/g' -e 's/types\.StringType/str/g' \
      /usr/local/bin/dstat
