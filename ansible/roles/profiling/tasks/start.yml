---
- name: Ensure dstat uses python3
  replace:
    path: /usr/local/bin/dstat
    regexp: '^#!/usr/bin/env python$'
    replace: '#!/usr/bin/env python3'

- name: Fix dstat Python 3.10 — add collections.abc import
  replace:
    path: /usr/local/bin/dstat
    regexp: '^import collections$'
    replace: "import collections\nimport collections.abc"

- name: Fix dstat Python 3.10 — collections.Sequence
  replace:
    path: /usr/local/bin/dstat
    regexp: '\bcollections\.Sequence\b'
    replace: 'collections.abc.Sequence'

- name: Fix dstat Python 3.10 — types.ListType and TupleType
  shell: |
    sudo sed -i -e 's/types\.ListType/list/g' -e 's/types\.TupleType/tuple/g' \
      -e 's/types\.StringTypes/str/g' -e 's/types\.StringType/str/g' \
      /usr/local/bin/dstat

- name: Remove previous /tmp/dstat.csv
  file:
    path: /tmp/dstat.csv
    state: absent

# This is necessary to clear disk caches, etc. This way the disk read
# and write statistics are consistent across test runs.
- name: Drop caches to reset state
  shell: echo 3 | sudo tee /proc/sys/vm/drop_caches

# We use dstat to periodically (every 1s) capture snapshots of system statistics.
# We output these snapshots to CSV for posterity.
#
# WARNING! - Do NOT change the options unless you are certain the CSV file is
#            backwards compatible. Changing the structure of this file makes it
#            very difficult to compare results across time with tools like Athena.
- name: Start dstat profiling
  command:
    argv:
      - dstat
      - --epoch
      - --cpu
      - --disk
      - --io
      - --load
      - --mem
      - --net
      - --proc
      - --sys
      - --socket
      - --tcp
      - --udp
      - --vm
      - --output
      - /tmp/dstat.csv
  async: 1000
  poll: 0
