---
- name: Install Vector
  when: vector_version is defined
  block:
    - name: Ensure vector is removed before installing
      apt:
        name: vector
        state: absent

    - name: Ensure vector user is removed before installing
      user:
        name: vector
        state: absent
        remove: yes

    - name: Install Vector .deb package from URL (stable)
      when: vector_version is not regex('^dev-') and vector_version is not regex('^nightly')
      include_tasks: "install_deb_from_url.yml"
      vars:
        deb: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"

    - name: Install Vector .deb package from URL (nightly)
      when: vector_version is regex('^nightly')
      include_tasks: "install_deb_from_url.yml"
      vars:
        deb: "https://packages.timber.io/vector/nightly/{{ vector_version | regex_replace('^nightly-', '') }}/vector_nightly-1_amd64.deb"

    - name: Install Vector .deb package from local file
      when: vector_version is regex('^dev-')
      include_tasks: "install_deb_from_file.yml"
      vars:
        local_deb: "{{ local_vector_deb_path }}"

    - name: Ensure vector user is in docker group
      user:
        name: vector
        groups: docker
        append: yes

    - name: Remove demo vector.yaml shipped by package
      file:
        path: /etc/vector/vector.yaml
        state: absent

    - name: Create systemd drop-in directory for vector
      file:
        path: /etc/systemd/system/vector.service.d
        state: directory
        mode: '0755'

    - name: Install systemd drop-in to use explicit config path
      copy:
        dest: /etc/systemd/system/vector.service.d/config.conf
        content: |
          [Service]
          ExecStartPre=
          ExecStartPre=/usr/bin/vector validate --config-yaml /etc/vector/vector.yaml
          ExecStart=
          ExecStart=/usr/bin/vector --config-yaml /etc/vector/vector.yaml
        mode: '0644'

    # This ensures that the process is not running. Each test is responsible
    # for starting and stopping the relevant services.
    - name: Ensure the vector service is stopped
      systemd:
        name: vector
        daemon_reload: yes
        enabled: no
        state: stopped
