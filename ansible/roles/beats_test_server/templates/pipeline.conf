# Decode and acknowledge Beats frames before the plain TCP test server counts
# events. This process is a receiver, separate from the agent being tested.
input {
  beats {
    host => "127.0.0.1"
    port => {{ beats_consumer_port }}
  }
}

output {
  tcp {
    host => "127.0.0.1"
    port => {{ tcp_consumer_port }}
    codec => json_lines
  }
}
