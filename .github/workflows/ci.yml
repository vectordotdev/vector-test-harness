name: Rust harness

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.0
      - run: cargo test --locked
      - name: Install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq5 libyaml-0-2 libsasl2-2 libcurl4
      - name: Smoke test the pinned Linux campaign
        run: >-
          target/debug/vth campaign --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/vth-campaign"
          --events 1000 --timeout-secs 90
